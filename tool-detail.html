<!DOCTYPE html>

<head>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --forest:#1A2E1A; --sage:#4A7C59; --sage-light:#6A9E79;
      --pale:#C8D8B0; --sand:#F5F0E8; --terracotta:#E8602C;
      --terracotta-dark:#C04E22; --white:#FFFFFF;
      --text:#1A2E1A; --text-muted:#5A6E5A;
      --radius:10px; --shadow:0 4px 24px rgba(26,46,26,.12);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{font-family:'Inter',sans-serif;background:var(--sand);color:var(--text);line-height:1.6;}
    a{color:inherit;text-decoration:none;}
    img{display:block;max-width:100%;}
    nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 5%;height:64px;background:rgba(26,46,26,.97);backdrop-filter:blur(8px);}
    .nav-logo{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--pale);letter-spacing:.04em;}
    .nav-logo span{color:var(--terracotta);}
    .nav-back{color:var(--pale);font-size:.85rem;font-weight:500;opacity:.7;display:flex;align-items:center;gap:.4rem;transition:opacity .2s;cursor:pointer;}
    .nav-back:hover{opacity:1;}
    .nav-auth{background:var(--terracotta);color:var(--white);padding:.4rem 1rem;border-radius:6px;font-size:.85rem;font-weight:600;transition:background .2s;}
    .nav-auth:hover{background:var(--terracotta-dark);}
    .breadcrumb{margin-top:64px;background:var(--white);padding:.75rem 5%;border-bottom:1px solid var(--pale);display:flex;align-items:center;gap:.6rem;font-size:.8rem;color:var(--text-muted);}
    .breadcrumb a{color:var(--sage);font-weight:600;}
    .breadcrumb a:hover{text-decoration:underline;}
    .breadcrumb .sep{opacity:.4;}
    .detail-wrapper{max-width:1100px;margin:0 auto;padding:2rem 5% 6rem;}
    .detail-layout{display:grid;grid-template-columns:1fr 340px;gap:2.5rem;align-items:start;}
    .detail-left{display:flex;flex-direction:column;gap:2rem;}
    .tool-title-block{background:var(--white);border-radius:16px;padding:1.8rem;box-shadow:var(--shadow);}
    .tool-cat-badge{display:inline-flex;align-items:center;gap:.4rem;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--sage);background:rgba(74,124,89,.1);padding:.3rem .8rem;border-radius:4px;margin-bottom:.9rem;}
    .tool-title{font-family:'Playfair Display',serif;font-size:clamp(1.5rem,3vw,2rem);color:var(--forest);line-height:1.2;margin-bottom:.8rem;}
    .tool-meta-row{display:flex;flex-wrap:wrap;align-items:center;gap:1rem;}
    .tool-meta-item{display:flex;align-items:center;gap:.35rem;font-size:.82rem;color:var(--text-muted);}
    .tool-meta-item strong{color:var(--forest);}
    .dispo-badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:.3rem .8rem;border-radius:20px;}
    .dispo-badge.yes{background:rgba(74,124,89,.15);color:var(--sage);}
    .dispo-badge.no{background:rgba(232,96,44,.12);color:var(--terracotta);}
    .gal-main{width:100%;height:300px;border-radius:16px;overflow:hidden;position:relative;cursor:zoom-in;margin-bottom:.75rem;box-shadow:var(--shadow);}
    .gal-main-bg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:6rem;transition:transform .3s;}
    .gal-main:hover .gal-main-bg{transform:scale(1.04);}
    .gal-main-label{position:absolute;bottom:.8rem;left:.8rem;background:rgba(26,46,26,.7);color:var(--pale);font-size:.7rem;font-weight:600;padding:.25rem .65rem;border-radius:6px;backdrop-filter:blur(4px);}
    .gal-thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;}
    .gal-thumb{height:72px;border-radius:10px;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:all .18s;display:flex;align-items:center;justify-content:center;font-size:1.8rem;position:relative;}
    .gal-thumb.active,.gal-thumb:hover{border-color:var(--sage);transform:translateY(-2px);}
    .gal-thumb-label{position:absolute;bottom:0;left:0;right:0;background:rgba(26,46,26,.6);color:rgba(200,216,176,.9);font-size:.58rem;font-weight:600;text-align:center;padding:.2rem;}
    .ds{background:var(--white);border-radius:16px;padding:1.6rem;box-shadow:var(--shadow);}
    .ds-title{font-family:'Playfair Display',serif;font-size:1.15rem;color:var(--forest);margin-bottom:1rem;padding-bottom:.7rem;border-bottom:2px solid var(--sand);}
    .ds-desc{font-size:.9rem;color:var(--text-muted);line-height:1.7;margin-bottom:1.2rem;}
    .ds-highlights{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.2rem;}
    .ds-hl{display:flex;align-items:center;gap:.4rem;background:rgba(74,124,89,.08);border:1px solid rgba(74,124,89,.2);border-radius:8px;padding:.35rem .8rem;font-size:.78rem;color:var(--sage);font-weight:600;}
    .spec-table{width:100%;border-collapse:collapse;}
    .spec-table tr:nth-child(even) td{background:var(--sand);}
    .spec-table td{padding:.55rem .7rem;font-size:.84rem;border-radius:4px;}
    .spec-table td:first-child{font-weight:600;color:var(--text-muted);width:45%;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;}
    .spec-table td:last-child{color:var(--forest);font-weight:500;}
    .acc-list{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.8rem;}
    .acc-tag{background:var(--sand);border:1px solid var(--pale);border-radius:8px;padding:.3rem .75rem;font-size:.78rem;color:var(--text-muted);}
    .condition-box{background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.25);border-radius:10px;padding:.8rem 1rem;font-size:.82rem;color:#92400e;margin-top:1rem;line-height:1.5;}
    .owner-flex{display:flex;align-items:center;gap:1.2rem;}
    .owner-avatar{width:60px;height:60px;border-radius:50%;background:var(--sage);display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0;}
    .owner-name{font-weight:700;font-size:1rem;color:var(--forest);}
    .owner-job{font-size:.78rem;color:var(--text-muted);margin-bottom:.3rem;}
    .owner-stats{display:flex;gap:1rem;flex-wrap:wrap;margin-top:.8rem;}
    .owner-stat{text-align:center;background:var(--sand);border-radius:10px;padding:.6rem 1rem;}
    .owner-stat-num{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:900;color:var(--forest);}
    .owner-stat-label{font-size:.68rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;}
    .owner-verified{display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;font-weight:700;color:var(--sage);background:rgba(74,124,89,.1);padding:.2rem .6rem;border-radius:4px;}
    .btn-msg{display:inline-flex;align-items:center;gap:.5rem;margin-top:1rem;padding:.55rem 1.2rem;border-radius:8px;border:1.5px solid var(--pale);background:transparent;font-size:.85rem;font-weight:600;color:var(--text-muted);cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif;}
    .btn-msg:hover{border-color:var(--sage);color:var(--sage);}
    .avail-months{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;}
    .avail-month-title{font-weight:700;font-size:.85rem;color:var(--forest);text-align:center;margin-bottom:.8rem;text-transform:capitalize;}
    .avail-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
    .avail-hd{text-align:center;font-size:.65rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;padding:.2rem 0;}
    .avail-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:.75rem;cursor:pointer;border:1px solid transparent;transition:all .12s;font-weight:500;}
    .avail-day:hover:not(.avail-empty):not(.avail-past):not(.avail-booked):not(.avail-pending){background:rgba(74,124,89,.12);border-color:var(--sage);}
    .avail-empty{cursor:default;}
    .avail-past{color:#ccc;cursor:default;}
    .avail-today{border-color:var(--forest)!important;font-weight:700;color:var(--forest);}
    .avail-booked{background:var(--sage)!important;color:var(--white)!important;border-color:var(--sage)!important;cursor:not-allowed;}
    .avail-pending{background:rgba(245,166,35,.85)!important;color:var(--white)!important;border-color:#e09b1a!important;cursor:not-allowed;}
    .avail-selected{background:var(--forest)!important;color:var(--white)!important;border-color:var(--forest)!important;}
    .avail-range{background:rgba(26,46,26,.12)!important;border-color:rgba(26,46,26,.2)!important;}
    .avail-legend{display:flex;gap:1rem;flex-wrap:wrap;margin-top:1rem;padding-top:.8rem;border-top:1px solid var(--sand);}
    .avail-leg{display:flex;align-items:center;gap:.35rem;font-size:.72rem;color:var(--text-muted);}
    .avail-leg-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
    .review-summary{display:flex;align-items:center;gap:1.5rem;margin-bottom:1.5rem;padding-bottom:1.2rem;border-bottom:1px solid var(--sand);}
    .review-big-rating{font-family:'Playfair Display',serif;font-size:3rem;font-weight:900;color:var(--forest);line-height:1;}
    .review-stars{color:#f5a623;font-size:1.1rem;letter-spacing:.1em;}
    .review-count{font-size:.8rem;color:var(--text-muted);margin-top:.2rem;}
    .review-bars{flex:1;}
    .review-bar-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.3rem;}
    .review-bar-label{font-size:.72rem;color:var(--text-muted);width:12px;text-align:right;}
    .review-bar-track{flex:1;height:6px;background:var(--sand);border-radius:3px;overflow:hidden;}
    .review-bar-fill{height:100%;background:var(--sage);border-radius:3px;}
    .review-list{display:flex;flex-direction:column;gap:1.2rem;}
    .review-item{padding:1rem;background:var(--sand);border-radius:12px;}
    .review-header{display:flex;align-items:center;gap:.8rem;margin-bottom:.6rem;}
    .review-avatar{width:36px;height:36px;border-radius:50%;background:var(--pale);display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0;}
    .review-author{font-weight:600;font-size:.85rem;color:var(--forest);}
    .review-role{font-size:.72rem;color:var(--text-muted);}
    .review-stars-sm{color:#f5a623;font-size:.75rem;}
    .review-date{font-size:.72rem;color:var(--text-muted);}
    .review-text{font-size:.85rem;color:var(--text-muted);line-height:1.6;font-style:italic;}
    .price-sticky{position:sticky;top:84px;background:var(--white);border-radius:18px;box-shadow:0 8px 36px rgba(26,46,26,.18);padding:1.6rem;border:1.5px solid var(--pale);}
    .price-main{display:flex;align-items:baseline;gap:.3rem;margin-bottom:.3rem;}
    .price-amount{font-family:'Playfair Display',serif;font-size:2rem;font-weight:900;color:var(--terracotta);}
    .price-period{font-size:.85rem;color:var(--text-muted);}
    .price-caution{font-size:.78rem;color:var(--text-muted);margin-bottom:1.2rem;}
    .price-rating-row{display:flex;align-items:center;gap:.5rem;margin-bottom:1.4rem;padding-bottom:1.2rem;border-bottom:1px solid var(--sand);}
    .price-rating-stars{color:#f5a623;font-size:.85rem;}
    .price-rating-num{font-weight:600;font-size:.85rem;color:var(--forest);}
    .price-rating-ct{font-size:.78rem;color:var(--text-muted);}
    .form-label{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);margin-bottom:.35rem;}
    .form-date-row{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:.8rem;}
    .form-input{width:100%;padding:.6rem .8rem;border-radius:8px;border:1.5px solid var(--pale);background:var(--sand);color:var(--text);font-family:'Inter',sans-serif;font-size:.85rem;outline:none;transition:border-color .2s;}
    .form-input:focus{border-color:var(--sage);background:var(--white);}
    .price-breakdown{background:var(--sand);border-radius:10px;padding:.9rem;margin-bottom:1rem;display:none;}
    .price-breakdown-row{display:flex;justify-content:space-between;font-size:.82rem;color:var(--text-muted);margin-bottom:.35rem;}
    .price-breakdown-total{display:flex;justify-content:space-between;font-weight:700;font-size:.95rem;color:var(--forest);padding-top:.5rem;border-top:1px solid var(--pale);margin-top:.3rem;}
    .btn-reserve{width:100%;padding:.85rem;border-radius:10px;background:var(--terracotta);color:var(--white);font-weight:700;font-size:.95rem;border:none;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif;}
    .btn-reserve:hover{background:var(--terracotta-dark);transform:translateY(-1px);}
    .btn-reserve:disabled{background:#ccc;cursor:not-allowed;transform:none;}
    .reserve-auth-note{text-align:center;font-size:.75rem;color:var(--text-muted);margin-top:.7rem;}
    .reserve-auth-note a{color:var(--sage);font-weight:600;}
    .price-guarantees{display:flex;flex-direction:column;gap:.5rem;margin-top:1.2rem;padding-top:1rem;border-top:1px solid var(--sand);}
    .pg-item{display:flex;align-items:center;gap:.6rem;font-size:.75rem;color:var(--text-muted);}
    .mobile-cta{display:none;position:fixed;bottom:0;left:0;right:0;z-index:90;background:var(--white);border-top:1px solid var(--pale);padding:1rem 5%;align-items:center;justify-content:space-between;box-shadow:0 -4px 20px rgba(26,46,26,.12);}
    .mobile-cta-price{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:900;color:var(--terracotta);}
    .mobile-cta-price span{font-family:'Inter',sans-serif;font-size:.8rem;font-weight:400;color:var(--text-muted);}
    .mobile-cta-btn{background:var(--terracotta);color:var(--white);padding:.7rem 1.6rem;border-radius:8px;font-weight:700;font-size:.9rem;border:none;cursor:pointer;}
    .toast{position:fixed;bottom:5rem;right:2rem;z-index:300;background:var(--forest);color:var(--pale);padding:1rem 1.5rem;border-radius:12px;font-size:.9rem;box-shadow:var(--shadow);display:flex;align-items:center;gap:.7rem;transform:translateY(80px);opacity:0;transition:all .35s;}
    .toast.show{transform:translateY(0);opacity:1;}
    @media(max-width:900px){.detail-layout{grid-template-columns:1fr;}.detail-right{display:none;}.mobile-cta{display:flex;}.avail-months{grid-template-columns:1fr;}}
    @media(max-width:600px){.gal-main{height:220px;}.review-summary{flex-direction:column;gap:.8rem;}}
  </style>
</head>

const params = new URLSearchParams(location.search);

let selStart = null, selEnd = null;
const MONTHS_FR = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

function renderCalendar() {
  const now = new Date();
  const months = [
    {y:now.getFullYear(),m:now.getMonth()},
    {y:now.getMonth()===11?now.getFullYear()+1:now.getFullYear(),m:(now.getMonth()+1)%12}
  ];
  document.getElementById('availMonths').innerHTML = months.map(({y,m})=>buildMonth(y,m)).join('');
}
function buildMonth(y,m) {
  const today = new Date(); today.setHours(0,0,0,0);
  const firstDow = new Date(y,m,1).getDay();
  const offset = firstDow===0?6:firstDow-1;
  const total = new Date(y,m+1,0).getDate();
  const booked = new Set(tool.bookedDays), pending = new Set(tool.pendingDays);
  let cells = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(h=>`<div class="avail-hd">${h}</div>`).join('');
  for(let i=0;i<offset;i++) cells+='<div class="avail-day avail-empty"></div>';
  for(let d=1;d<=total;d++){
    const key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const date=new Date(y,m,d);
    const isPast=date<today, isToday=date.getTime()===today.getTime();
    const isBooked=booked.has(key), isPending=pending.has(key);
    const isSel=key===selStart||key===selEnd;
    const isRange=selStart&&selEnd&&key>selStart&&key<selEnd;
    let cls='avail-day';
    if(isPast) cls+=' avail-past';
    if(isToday) cls+=' avail-today';
    if(isBooked) cls+=' avail-booked';
    else if(isPending) cls+=' avail-pending';
    else if(isSel) cls+=' avail-selected';
    else if(isRange) cls+=' avail-range';
    const clickable=!isPast&&!isBooked&&!isPending;
    cells+=`<div class="${cls}" ${clickable?`onclick="selectDay('${key}')"`:''}>${d}</div>`;
  }
  return `<div class="avail-month"><div class="avail-month-title">${MONTHS_FR[m]} ${y}</div><div class="avail-grid">${cells}</div></div>`;
}
function selectDay(key) {
  if(!selStart||(selStart&&selEnd)){selStart=key;selEnd=null;}
  else{ if(key<=selStart){selStart=key;selEnd=null;} else{selEnd=key;} }
  renderCalendar();
  if(selStart&&selEnd) syncDatesToForm();
}
function syncDatesToForm(){
  const s=document.getElementById('inputStart'), e=document.getElementById('inputEnd');
  if(s) s.value=selStart; if(e) e.value=selEnd; calcPrice();
}

  document.getElementById('priceCard').innerHTML = `

      <div class="pg-item">📄 Bon de remise numérique inclus</div>
      <div class="pg-item">🏢 Couvert par l'assurance Allianz</div>
    </div>`;
  if(selStart&&selEnd) syncDatesToForm();

function renderMobileCta(){
  document.getElementById('mobilePrice').innerHTML=`${tool.price} € <span>/jour</span>`;

function calcPrice(){
  const s=document.getElementById('inputStart')?.value;
  const e=document.getElementById('inputEnd')?.value;
  if(!s||!e||e<=s) return;
  const days=Math.max(1,Math.round((new Date(e)-new Date(s))/86400000));
  const rent=days*tool.price;
  document.getElementById('bdDays').textContent=`${days} jour${days>1?'s':''}`;
  document.getElementById('bdRent').textContent=`${rent} €`;
  document.getElementById('bdTotal').textContent=`${rent} € + caution`;
  document.getElementById('priceBreakdown').style.display='block';
  selStart=s; selEnd=e; renderCalendar();
}

function handleReserve(){
  if(!session){location.href='auth.html';return;}
  const s=document.getElementById('inputStart')?.value;
  const e=document.getElementById('inputEnd')?.value;
  if(!s||!e||e<=s){showToast('📅','Sélectionnez des dates valides');return;}
  showToast('✅',`Réservation envoyée à ${tool.owner.name} !`);
  document.getElementById('btnReserve').textContent='✓ Demande envoyée';
  document.getElementById('btnReserve').disabled=true;
}

function handleMsg(){
  if(!session){location.href='auth.html';return;}
  showToast('💬',`Message envoyé à ${tool.owner.name}`);
}

function scrollToCalendar(){
  document.getElementById('calSection').scrollIntoView({behavior:'smooth'});
}

function showToast(icon,msg){
  const t=document.getElementById('toast');
  document.getElementById('toastIcon').textContent=icon;
  document.getElementById('toastMsg').textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),4000);
}
